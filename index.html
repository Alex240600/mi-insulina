<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi insulina</title>
<meta name="description" content="Calcula la insulina rápida antes de comer con los números de tu pauta.">
<meta property="og:title" content="Mi insulina">
<meta property="og:description" content="Calcula la insulina rápida antes de comer con los números de tu pauta.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#edf2f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1419" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<style>
@font-face{font-family:"Lexend";font-style:normal;font-weight:400;font-display:swap;src:url("lexend-400.woff2") format("woff2")}
@font-face{font-family:"Lexend";font-style:normal;font-weight:700;font-display:swap;src:url("lexend-700.woff2") format("woff2")}

/* Diseño: una columna estrecha, como una ficha de bolsillo. Cuatro preguntas en orden y el resultado dibujado como la ventanilla de dosis del bolígrafo. Lexend en todo: números claros, con el cero de siempre. */
:root{
  --papel:#edf2f5;
  --ficha:#ffffff;
  --hueco:#e4ecf1;
  --tinta:#10222e;
  --gris:#52697a;
  --linea:#cfdae2;
  --acento:#0f5f86;
  --acento-tinta:#ffffff;
  --acento-suave:#dbeaf3;
  --ventana:#fbfaf4;
  --ventana-tinta:#0f1519;
  --baja:#b3261e;
  --baja-suave:#fcebea;
  --alta:#875600;
  --alta-suave:#fff0d1;
  --foco:#2b6fd6;
  --velo:rgba(6,14,20,.5);
  --sombra:0 1px 2px rgba(16,34,46,.06),0 6px 18px rgba(16,34,46,.07);
  --f-titulo:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-texto:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --papel:#0b1419;--ficha:#132029;--hueco:#1a2a34;--tinta:#e3ecf1;--gris:#9bb0bd;--linea:#263844;
    --acento:#5bbfe3;--acento-tinta:#04202c;--acento-suave:#11303e;
    --ventana:#f1f0e8;--ventana-tinta:#0f1519;
    --baja:#ff8a80;--baja-suave:#3a1512;--alta:#ffc35c;--alta-suave:#33270c;--foco:#8ab4ff;
    --velo:rgba(0,0,0,.6);--sombra:none;color-scheme:dark;
  }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--f-texto);font-size:18px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--papel)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.6;cursor:default}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--foco);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* Barra superior */
.barra{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--papel);border-bottom:1px solid var(--linea)}
.barra-in{max-width:540px;margin:0 auto;display:flex;align-items:center;gap:8px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.marca{flex:1;min-width:0;display:flex;align-items:center;gap:8px;margin:0;font-family:var(--f-titulo);font-weight:700;font-size:20px;letter-spacing:-.01em}
.marca svg{flex:none;color:var(--acento)}
.icono-btn{flex:none;width:48px;height:48px;padding:0;border:1px solid var(--linea);border-radius:12px;background:var(--ficha);color:var(--tinta);display:inline-grid;place-items:center}

/* Página */
.contenido{max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.vista,.grupo{display:flex;flex-direction:column;gap:14px}
.grupo-filas{display:flex;flex-direction:column;gap:10px}
.titulo-vista{margin:0;font-family:var(--f-titulo);font-weight:700;font-size:24px;line-height:1.2}
.entradilla{margin:0}
.ayuda{margin:0;color:var(--gris);font-size:16px}
.cabecera-vista{display:flex;align-items:center;gap:12px}

/* Instalar y enviar */
.instalar,.enviar{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:18px}
.instalar{background:var(--acento-suave)}
.enviar{border:1px solid var(--linea);background:var(--ficha)}
.instalar p,.enviar p{margin:0;display:flex;flex-direction:column;gap:2px}
.instalar b,.enviar b{font-size:18px}
.instalar span,.enviar span{color:var(--gris);font-size:16px}

/* Ficha con las cuatro preguntas */
.ficha{background:var(--ficha);border:1px solid var(--linea);border-radius:18px;box-shadow:var(--sombra)}
.paso{display:flex;flex-direction:column;gap:12px;padding:16px}
.ficha>.paso:not([hidden])~.paso{border-top:1px solid var(--linea)}
.pregunta{display:flex;gap:10px;align-items:flex-start;margin:0;font-size:19px;line-height:1.3;font-weight:700}
.num{flex:none;width:30px;height:30px;margin-top:-2px;border-radius:50%;background:var(--acento-suave);color:var(--acento);display:grid;place-items:center;font-size:16px;font-weight:700}
.rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opcion{min-height:56px;padding:8px 10px;border:2px solid var(--linea);border-radius:14px;background:var(--ficha);font-size:18px;font-weight:700}
.opcion[aria-pressed="true"]{border-color:var(--acento);background:var(--acento-suave);color:var(--acento)}
.campo-grande{display:flex;align-items:center;gap:12px}
.entrada-grande{flex:1;width:100%;min-width:0;height:72px;padding:0 14px;border:2px solid var(--linea);border-radius:14px;background:var(--hueco);font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.entrada-grande::placeholder{color:var(--gris);opacity:.55}
.entrada-grande:focus,.entrada:focus{outline:none;border-color:var(--acento)}
.unidad{color:var(--gris);font-size:18px;white-space:nowrap}
.centro{margin:-4px 0 0;text-align:center}
.stepper{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;gap:10px;align-items:center}
.stepper .entrada-grande{text-align:center}
.btn-paso{height:72px;padding:0;border:2px solid var(--linea);border-radius:14px;background:var(--ficha);color:var(--acento);font-size:36px;font-weight:700;line-height:1}
.pista{margin:0;color:var(--acento);font-size:16px;font-weight:700}

/* Botones */
.boton{display:block;width:100%;min-height:60px;padding:12px 16px;border:2px solid transparent;border-radius:16px;font-size:20px;font-weight:700;text-align:center}
.primario{background:var(--acento);color:var(--acento-tinta)}
.secundario{background:transparent;border-color:var(--linea);color:var(--tinta)}
.peligro{background:transparent;border-color:var(--baja);color:var(--baja)}
.grande{min-height:68px;font-size:22px}
.error{margin:0;color:var(--baja);font-weight:700}
.error:empty{display:none}
.pie{margin:0 8px;color:var(--gris);font-size:14px;text-align:center}

/* Resultado: la ventanilla del bolígrafo */
.boli{display:flex;flex-direction:column;gap:14px;padding:18px 18px 20px;border-radius:24px;background:var(--acento);color:var(--acento-tinta)}
.boli-etiqueta{margin:0;font-family:var(--f-titulo);font-weight:700;font-size:22px}
.boli-fila{display:flex;align-items:center;gap:16px}
.ventanilla{position:relative;flex:none;min-width:150px;height:150px;padding:0 18px 0 32px;border-radius:16px;background:var(--ventana);color:var(--ventana-tinta);box-shadow:inset 0 3px 0 rgba(0,0,0,.12),inset 0 -2px 0 rgba(0,0,0,.06),0 0 0 4px rgba(255,255,255,.22);overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tambor{display:flex;justify-content:center;line-height:1;font-weight:700;font-variant-numeric:tabular-nums}
.tambor-centro{font-size:84px;letter-spacing:-.02em;padding-block:4px}
.tambor-arriba,.tambor-abajo{height:20px;overflow:hidden;opacity:.3}
.tambor-arriba{align-items:flex-end}
.tambor-abajo{align-items:flex-start}
.tambor i{font-style:normal;font-size:34px;line-height:1}
.ventanilla.larga .tambor-centro{font-size:64px}
.ventanilla.muy-larga .tambor-centro{font-size:50px}
.puntero{position:absolute;left:9px;top:50%;width:0;height:0;border-top:10px solid transparent;border-bottom:10px solid transparent;border-left:14px solid var(--ventana-tinta);transform:translateY(-50%)}
.boli-ud{margin:0;min-width:0;display:flex;flex-direction:column;gap:2px}
.boli-ud b{font-family:var(--f-titulo);font-size:26px;line-height:1.1}
.boli-ud span{font-size:16px;opacity:.9}
.boli-instruccion{margin:0;font-size:17px;font-weight:700}
.boli.mini{gap:10px;padding:14px 16px 16px}
.boli.mini .ventanilla{min-width:112px;height:112px;padding-left:28px}
.boli.mini .tambor-centro{font-size:60px}
.boli.mini .tambor i{font-size:26px}
.boli.mini .tambor-arriba,.boli.mini .tambor-abajo{height:14px}

.avisos{display:flex;flex-direction:column;gap:10px}
.avisos:empty{display:none}
.caja{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border-radius:14px;font-size:17px}
.caja svg{flex:none;margin-top:2px}
.caja.aviso{background:var(--alta-suave);color:var(--alta);font-weight:700}
.caja.nota{background:var(--hueco);color:var(--tinta)}
.cuenta{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--linea);border-radius:18px;background:var(--ficha)}
.cuenta h2{margin:0;color:var(--gris);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.linea{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 0;border-bottom:1px dashed var(--linea);font-size:17px}
.linea span{min-width:0}
.linea b{white-space:nowrap;font-variant-numeric:tabular-nums}
.linea s{margin-right:8px;color:var(--gris);font-weight:400}
.linea.total{border-bottom:0;font-weight:700}

.hipo{display:flex;flex-direction:column;gap:12px;padding:20px 18px;border:2px solid var(--baja);border-radius:22px;background:var(--baja-suave)}
.hipo h2{margin:0;color:var(--baja);font-family:var(--f-titulo);font-size:26px;line-height:1.2}
.hipo-dato{margin:0;font-size:20px;font-weight:700}
.hipo-dato span{display:block}
.hipo ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.hipo-112{margin:0;font-weight:700}

/* Bienvenida */
.chip{align-self:flex-start;padding:4px 10px;border-radius:999px;background:var(--hueco);color:var(--gris);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.ejemplo{margin:0;display:flex;flex-direction:column;gap:10px}
.ejemplo figcaption{color:var(--gris);font-size:15px}
.pasos-intro{margin:0;padding:8px 16px 8px 42px;background:var(--ficha);border:1px solid var(--linea);border-radius:18px}
.pasos-intro li{padding:6px 0}

/* Datos de la pauta */
.aviso-ajustes{margin:0;padding:14px 16px;border-radius:14px;background:var(--alta-suave);color:var(--alta);font-size:16px;font-weight:700}
.donde{margin:0;color:var(--gris);font-size:16px}
fieldset{margin:0;min-width:0;padding:16px;border:1px solid var(--linea);border-radius:18px;background:var(--ficha);display:flex;flex-direction:column;gap:10px}
fieldset.invalida{border:2px solid var(--baja)}
legend{float:left;width:100%;margin:0;padding:0;font-size:19px;font-weight:700}
fieldset .rejilla{grid-template-columns:1fr}
.sub{margin:6px 0 0;font-weight:700}
.radio-tarjeta{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--linea);border-radius:14px;cursor:pointer}
.radio-tarjeta:has(input:checked){border-color:var(--acento);background:var(--acento-suave)}
.radio-tarjeta input{flex:none;width:22px;height:22px;margin:2px 0 0;accent-color:var(--acento)}
.radio-tarjeta b{display:block}
.radio-tarjeta small{display:block;margin-top:2px;color:var(--gris);font-size:15px}
.check{display:flex;gap:10px;align-items:center;font-weight:700;cursor:pointer}
.check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--acento)}
.fila-campo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;border-top:1px solid var(--linea)}
.fila-campo label{min-width:0;font-weight:700}
.fila-campo small{display:block;color:var(--gris);font-size:15px;font-weight:400}
.entrada{flex:none;width:112px;height:54px;padding:0 12px;border:2px solid var(--linea);border-radius:12px;background:var(--hueco);font-size:21px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.entrada.invalida,.fila-tabla.invalida{border-color:var(--baja)}
.fila-tabla{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border:2px solid var(--linea);border-radius:14px}
.ft-linea{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.entrada.corta{width:84px;text-align:center}
.signo{flex:none;width:52px;height:54px;padding:0;border:2px solid var(--acento);border-radius:12px;background:var(--acento-suave);color:var(--acento);font-size:26px;font-weight:700}
.signo.resta{border-color:var(--alta);background:var(--alta-suave);color:var(--alta)}
.quitar{margin-left:auto}
.caja-errores{padding:12px 14px;border:2px solid var(--baja);border-radius:14px;background:var(--baja-suave)}
.caja-errores b{color:var(--baja)}
.caja-errores ul{margin:6px 0 0;padding-left:20px}

/* Historial */
.dia{margin:6px 4px -4px;color:var(--gris);font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.lista{padding:2px 16px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea)}
.item:last-child{border-bottom:0}
.item>div{min-width:0}
.item-t{font-weight:700}
.item-s{color:var(--gris);font-size:15px}
.item-d{color:var(--acento);font-size:24px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Confirmaciones y avisos flotantes */
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--velo)}
.modal-caja{width:100%;max-width:480px;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:20px 18px 14px;border-radius:20px;background:var(--ficha);color:var(--tinta)}
.modal-caja h2{margin:0;font-family:var(--f-titulo);font-size:21px}
.modal-texto{display:flex;flex-direction:column;gap:6px}
.modal-texto p{margin:0;font-size:17px}
.modal-enlace{width:100%;height:50px;padding:0 12px;border:2px solid var(--linea);border-radius:12px;background:var(--hueco);font-size:15px}
.toast{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;max-width:440px;margin:0 auto;padding:12px 18px;border-radius:16px;background:var(--tinta);color:var(--papel);font-weight:700;text-align:center;opacity:0;transform:translateY(12px);transition:opacity .2s,transform .2s;pointer-events:none}
.toast.visible{opacity:1;transform:none}

</style>
</head>

<div id="app"></div>
<noscript><p style="padding:16px">Para usar Mi insulina hay que activar JavaScript en el navegador.</p></noscript>
<script>
(function () {
  'use strict';

  /* ======================================================================
     LÓGICA DEL CÁLCULO
     Funciones puras: no tocan la pantalla. Así se pueden probar aparte.
     ====================================================================== */
  /* LOGICA-INICIO */
  var Logica = (function () {
    var COMIDAS = ['desayuno', 'comida', 'merienda', 'cena'];
    var NOMBRE_COMIDA = { desayuno: 'Desayuno', comida: 'Comida', merienda: 'Merienda', cena: 'Cena' };

    function esNum(n) { return typeof n === 'number' && isFinite(n); }
    function entre(n, min, max) { return esNum(n) && n >= min && n <= max; }

    // "1,5" o "1.5" -> 1.5. Vacío o con letras -> null.
    function leerNumero(texto) {
      if (texto === null || texto === undefined) return null;
      var t = String(texto).replace(/\s+/g, '').replace(/−/g, '-').replace(',', '.');
      if (!/^-?(\d+(\.\d*)?|\.\d+)$/.test(t)) return null;
      var n = parseFloat(t);
      return isFinite(n) ? n : null;
    }

    // Número con coma decimal, como se escribe en España.
    function fmt(n, dec) {
      if (!esNum(n)) return '';
      var d = dec === undefined ? 1 : dec;
      var f = Math.pow(10, d);
      var v = Math.round(n * f) / f;
      if (v === 0) v = 0;
      return String(v).replace('.', ',');
    }

    // Unidades de insulina: "+1,4 U", "−0,5 U", "6 U".
    function fmtU(v, conSigno) {
      if (!esNum(v)) return '';
      var r = Math.round(v * 10) / 10;
      if (r === 0) return '0 U';
      var s = r < 0 ? '−' : (conSigno ? '+' : '');
      return s + fmt(Math.abs(r)) + ' U';
    }

    // Comida que toca según la hora del móvil (luego se puede cambiar a mano).
    function comidaPorHora(fecha) {
      var m = fecha.getHours() * 60 + fecha.getMinutes();
      if (m >= 300 && m < 720) return 'desayuno';   // 5:00 a 11:59
      if (m >= 720 && m < 1020) return 'comida';    // 12:00 a 16:59
      if (m >= 1020 && m < 1200) return 'merienda'; // 17:00 a 19:59
      return 'cena';                                // 20:00 a 4:59
    }

    // Redondea a lo que marca el bolígrafo (de 1 en 1 o de 0,5 en 0,5).
    function redondear(valor, paso, modo) {
      var x = valor / paso;
      var k = modo === 'abajo' ? Math.floor(x + 1e-9) : Math.floor(x + 0.5 + 1e-9);
      var r = k * paso;
      return r <= 0 ? 0 : Math.round(r * 10) / 10;
    }

    function ratioDe(a, comida) { return a.mismoRatio ? a.ratio.todas : a.ratio[comida]; }

    function filaTabla(tabla, g) {
      var t = tabla || [];
      for (var i = 0; i < t.length; i++) if (g >= t[i].desde && g <= t[i].hasta) return t[i];
      return null;
    }

    // Comprueba que la pauta está completa y tiene sentido. Devuelve la lista de problemas.
    function validarAjustes(a) {
      var p = [];
      function mal(campo, texto) { p.push({ campo: campo, texto: texto }); }
      if (!a || typeof a !== 'object') { mal('pauta', 'Faltan los datos de la pauta.'); return p; }
      if (a.pauta !== 'ratio' && a.pauta !== 'fija') mal('pauta', 'Elige cómo calcula la dosis.');
      if (a.pauta === 'ratio') {
        var rac = a.unidadHidratos === 'raciones', gr = a.unidadHidratos === 'gramos';
        if (!rac && !gr) mal('unidadHidratos', 'Elige si cuenta los hidratos en raciones o en gramos.');
        var r = a.ratio || {};
        (a.mismoRatio ? ['todas'] : COMIDAS).forEach(function (c) {
          var de = c === 'todas' ? '' : ' de ' + NOMBRE_COMIDA[c].toLowerCase();
          if (gr) { if (!entre(r[c], 2, 100)) mal('ratio-' + c, 'Pon el ratio' + de + ': gramos que cubre 1 unidad (entre 2 y 100).'); }
          else if (!entre(r[c], 0.1, 10)) mal('ratio-' + c, 'Pon el ratio' + de + ': unidades por ración (entre 0,1 y 10).');
        });
        if (!entre(a.sensibilidad, 5, 500)) mal('sensibilidad', 'Pon el factor de sensibilidad (entre 5 y 500 mg/dL).');
        if (!entre(a.objetivo, 70, 200)) mal('objetivo', 'Pon el objetivo de glucosa (entre 70 y 200 mg/dL).');
        else if (esNum(a.hipo) && a.objetivo <= a.hipo) mal('objetivo', 'El objetivo tiene que ser mayor que el aviso de bajada.');
      }
      if (a.pauta === 'fija') {

  document.getElementById('app').innerHTML = MARCADO;
  function $(id) { return document.getElementById(id); }

  /* ---------- Lo que se guarda en este móvil ---------- */
  var CLAVE_PAUTA = 'miInsulina.pauta.v1';
  var CLAVE_HIS = 'miInsulina.historial.v1';
  var memoria = {};
  function leer(clave) {
    try {
      var t = window.localStorage.getItem(clave);
      if (t !== null) return JSON.parse(t);
    } catch (e) { /* este navegador no deja leer */ }
    return Object.prototype.hasOwnProperty.call(memoria, clave) ? memoria[clave] : null;
  }
  function guardar(clave, valor) {
    memoria[clave] = valor;
    try { window.localStorage.setItem(clave, JSON.stringify(valor)); return true; }
    catch (e) { return false; }
  }
  // Pide al navegador que no borre estos datos aunque le falte espacio.
  function pedirPersistencia() {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {}
  }

  /* ---------- La pauta ---------- */
  function valida(p) { return !!p && typeof p === 'object' && L.validarAjustes(p).length === 0; }
  var pauta = leer(CLAVE_PAUTA);
  var aj = null;
  function recalcularActiva() { aj = valida(pauta) ? pauta : null; }
  recalcularActiva();
  function guardarPauta(p) {
    var ok = guardar(CLAVE_PAUTA, p);
    pauta = p;
    recalcularActiva();
    estado.reciente = null;
    pedirPersistencia();
    return ok;
  }

  /* ---------- Navegación entre pantallas ---------- */
  var VISTAS = ['vistaBienvenida', 'vistaCalcular', 'vistaResultado', 'vistaAjustes', 'vistaHistorial'];
  var vistaActual = null;
  var enSubvista = false, ignorarPop = false;
  function mostrar(id) {
    VISTAS.forEach(function (v) { $(v).hidden = (v !== id); });
    vistaActual = id;
    pintarInstalar();
    try { window.scrollTo(0, 0); } catch (e) {}
  }
  // Las pantallas de resultado, datos e historial añaden un paso al historial del navegador,
  // para que el botón «atrás» del móvil vuelva a la calculadora en vez de cerrar la app.
  function abrir(id) {
    mostrar(id);
    if (!enSubvista) { try { history.pushState({ miInsulina: 1 }, ''); enSubvista = true; } catch (e) {} }
  }
  function cerrar() {
    irInicio();
    if (enSubvista) {
      enSubvista = false;
      ignorarPop = true;
      try { history.back(); } catch (e) { ignorarPop = false; }
    }
  }
  window.addEventListener('popstate', function () {
    if (ignorarPop) { ignorarPop = false; return; }
    enSubvista = false;
    cerrarModal(false);
    irInicio();
  });
  function irInicio() {
    if (aj) { prepararCalculo(); mostrar('vistaCalcular'); }
    else mostrar('vistaBienvenida');
  }

  /* ---------- Instalar en el móvil ---------- */
  var eventoInstalar = null;
  function enModoApp() {
    try { if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true; } catch (e) {}
    return window.navigator.standalone === true;
  }
  function pintarInstalar() {
    var caja = $('cajaInstalar');
    if (!caja) return;
    caja.hidden = !(eventoInstalar && !enModoApp() && (vistaActual === 'vistaCalcular' || vistaActual === 'vistaBienvenida'));
  }
  window.addEventListener('beforeinstallprompt', function (ev) {
    ev.preventDefault();
    eventoInstalar = ev;
    pintarInstalar();
  });
  window.addEventListener('appinstalled', function () {
    eventoInstalar = null;
    pintarInstalar();
    aviso('Instalada. Ya tienes el icono en la pantalla de inicio.');
  });
  $('btnInstalar').addEventListener('click', function () {
    var ev = eventoInstalar;
    if (!ev) return;
    eventoInstalar = null;
    pintarInstalar();
    try { ev.prompt(); } catch (e) {}
  });

  /* ---------- Fechas y horas ---------- */
  function dos(n) { return (n < 10 ? '0' : '') + n; }
  function hora(t) { var d = new Date(t); return dos(d.getHours()) + ':' + dos(d.getMinutes()); }
  function hace(t) {
    var min = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (min < 60) return 'hace ' + min + ' min';
    var h = Math.floor(min / 60), m = min % 60;
    return 'hace ' + h + ' h' + (m ? ' ' + m + ' min' : '');
  }
  function dia(t) {
    var d = new Date(t), hoy = new Date(), ayer = new Date();
    ayer.setDate(hoy.getDate() - 1);
    function mismo(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
    if (mismo(d, hoy)) return 'Hoy';
    if (mismo(d, ayer)) return 'Ayer';
    var dias = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
    return dias[d.getDay()] + ' ' + d.getDate() + '/' + (d.getMonth() + 1);
  }

  /* ---------- Historial ---------- */
  function historial() { var h = leer(CLAVE_HIS); return Array.isArray(h) ? h : []; }
  function ultimaReciente() {
    var h = historial();
    if (!h.length || !aj) return null;
    var u = h[0];
    if (!u || typeof u.t !== 'number') return null;
    var horas = (Date.now() - u.t) / 3600000;
    return (horas >= 0 && horas < aj.horasActiva) ? u : null;
  }

  /* ---------- Pantalla de cálculo ---------- */
  var estado = { comida: null, reciente: null };
  var ultimo = null;
  function marcarGrupo(grupo, valor) {
    var bs = document.querySelectorAll('[data-grupo="' + grupo + '"]');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', bs[i].getAttribute('data-valor') === valor ? 'true' : 'false');
  }
  function errorCalc(t) { $('errorCalc').textContent = t; }

  document.addEventListener('click', function (ev) {
    var b = ev.target.closest ? ev.target.closest('[data-grupo]') : null;
    if (b) {
      var g = b.getAttribute('data-grupo'), v = b.getAttribute('data-valor');
      if (g === 'comida') estado.comida = v;
      if (g === 'reciente') estado.reciente = (v === 'si');
      marcarGrupo(g, v);
      errorCalc('');
      return;
    }
    if (ev.target.closest && ev.target.closest('[data-cerrar]')) cerrar();
  });

  function prepararCalculo() {
    var ratio = aj.pauta === 'ratio';
    $('pasoComida').hidden = ratio && aj.mismoRatio === true;
    $('pasoHidratos').hidden = !ratio;
    if (!estado.comida) estado.comida = L.comidaPorHora(new Date());
    marcarGrupo('comida', estado.comida);
    if (ratio) {
      var rac = aj.unidadHidratos === 'raciones';
      $('tituloHidratos').textContent = rac ? '¿Cuántas raciones de hidratos vas a comer?' : '¿Cuántos gramos de hidratos vas a comer?';
      $('unidadHidratos').textContent = rac ? 'raciones' : 'gramos';
      $('ayudaHidratos').textContent = rac ? '1 ración = 10 g de hidratos. Si no vas a comer hidratos, pon 0.' : 'Si no vas a comer hidratos, pon 0.';
      $('menos').setAttribute('aria-label', rac ? 'Media ración menos' : '5 gramos menos');
      $('mas').setAttribute('aria-label', rac ? 'Media ración más' : '5 gramos más');
    }
    $('tituloReciente').textContent = '¿Te has pinchado insulina rápida en las últimas ' + L.fmt(aj.horasActiva) + ' horas?';
    var n = 1;
    ['pasoComida', 'pasoGlucosa', 'pasoHidratos', 'pasoReciente'].forEach(function (id) {
      if (!$(id).hidden) $(id).querySelector('.num').textContent = String(n++);
    });
    var u = ultimaReciente();
    if (u) {
      estado.reciente = true;
      $('pistaReciente').textContent = 'Anotaste ' + L.fmt(u.dosis) + ' U a las ' + hora(u.t) + ' (' + hace(u.t) + ').';
      $('pistaReciente').hidden = false;
    } else {
      $('pistaReciente').hidden = true;
    }
    marcarGrupo('reciente', estado.reciente === null ? '' : (estado.reciente ? 'si' : 'no'));
  }

  function cambiarHidratos(dir) {
    var p = aj.unidadHidratos === 'raciones' ? 0.5 : 5;
    var v = L.leerNumero($('hidratos').value);
    if (v === null || v < 0) v = 0;
    v = Math.round((v + dir * p) / p) * p;
    if (v < 0) v = 0;
    $('hidratos').value = L.fmt(v);
    errorCalc('');
  }
  $('menos').addEventListener('click', function () { cambiarHidratos(-1); });
  $('mas').addEventListener('click', function () { cambiarHidratos(1); });
  $('glucosa').addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    if (!$('pasoHidratos').hidden) $('hidratos').focus(); else ev.target.blur();
  });
  $('hidratos').addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); ev.target.blur(); }
  });
  $('glucosa').addEventListener('input', function () { errorCalc(''); });
  $('hidratos').addEventListener('input', function () { errorCalc(''); });

  function leerCampo(id) {
    var raw = $(id).value.trim();
    return raw === '' ? { vacio: true, n: null } : { vacio: false, n: L.leerNumero(raw) };
  }

  $('btnCalcular').addEventListener('click', function () {
    if (!aj) { irInicio(); return; }
    var g = leerCampo('glucosa');
    if (!g.vacio && g.n === null) { errorCalc('Escribe la glucosa solo con números.'); return; }
    var ratio = aj.pauta === 'ratio';
    var h = ratio ? leerCampo('hidratos') : { vacio: false, n: 0 };
    if (ratio && !h.vacio && h.n === null) { errorCalc('Escribe ' + (aj.unidadHidratos === 'raciones' ? 'las raciones' : 'los gramos') + ' solo con números.'); return; }
    var r = L.calcular(aj, { comida: estado.comida, glucosa: g.n, hidratos: h.n, reciente: estado.reciente });
    if (r.estado === 'error') { errorCalc(r.texto); return; }
    errorCalc('');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

  /* ---------- Resultado ---------- */
  function caja(tipo, texto) {
    var d = document.createElement('div');
    d.className = 'caja ' + tipo;
    d.innerHTML = tipo === 'aviso' ? ICONO_AVISO : ICONO_INFO;
    var s = document.createElement('span');
    s.textContent = texto;
    d.appendChild(s);

  }
  function linea(texto, valor, tachado, conSigno, total) {

    var a = document.createElement('span');
    a.textContent = texto;
    var b = document.createElement('b');
    if (tachado !== null && tachado !== undefined) {
      var s = document.createElement('s');
      s.textContent = L.fmtU(tachado, true);
      b.appendChild(s);
    }
    b.appendChild(document.createTextNode(L.fmtU(valor, conSigno)));
    d.appendChild(a);
    d.appendChild(b);
    return d;
  }
  function textoRedondeo(r) {
    var p = aj.paso === 0.5 ? 'de 0,5 en 0,5' : 'de 1 en 1';

    return 'Tu bolígrafo marca ' + p + ': ' + L.fmt(r.exacto) + ' U se redondea ' + (aj.redondeo === 'abajo' ? 'hacia abajo ' : '') + 'a ' + L.fmt(r.dosis) + ' U.';

    $('ventanilla').classList.toggle('larga', txt.length === 3);

      : (paso === 1 ? 'Gira el bolígrafo hasta que veas el ' + txt + ' en la ventanilla.' : 'Marca ' + txt + ' unidades en el bolígrafo.');

  function limpiarCalculo() {

  /* ---------- Historial ---------- */
  function pintarHistorial() {
    var h = historial(), cont = $('listaHistorial');
    cont.textContent = '';

    if (!h.length) {
      var p = document.createElement('p');

      return;

    var diaPrevio = null, grupo = null;
    h.slice(0, 100).forEach(function (x) {
      var d = dia(x.t);
      if (d !== diaPrevio) {
        var t = document.createElement('h2');
        t.className = 'dia';
        t.textContent = d;
        cont.appendChild(t);
        grupo = document.createElement('div');
        grupo.className = 'ficha lista';

      var l1 = document.createElement('div');

  $('btnHistorial').addEventListener('click', function () { pintarHistorial(); abrir('vistaHistorial'); });
  $('btnBorrarHis').addEventListener('click', function () {
    confirmar('¿Borrar el historial?', ['Se borran todas las dosis anotadas en este móvil. No se puede deshacer.'], 'Sí, borrar', function () {
      guardar(CLAVE_HIS, []);
      pintarHistorial();
      aviso('Historial borrado');
    });
  });

  /* ---------- Datos de la pauta ---------- */
  var filas = [];
  function abrirAjustes() {
    cargarFormulario(valida(pauta) ? pauta : { hipo: 70, alta: 250, redondeo: 'cercano', mismoRatio: false, tabla: [] });
    $('cajaEnviar').hidden = !valida(pauta);
    abrir('vistaAjustes');
  }
  function ponRadio(nombre, valor) {
    var rs = document.querySelectorAll('input[name="' + nombre + '"]');
    for (var i = 0; i < rs.length; i++) rs[i].checked = valor !== null && valor !== undefined && rs[i].value === String(valor);
  }
  function valorRadio(nombre) {
    var r = document.querySelector('input[name="' + nombre + '"]:checked');
    return r ? r.value : null;
  }
  function ponNum(id, v) { $(id).value = (typeof v === 'number' && isFinite(v)) ? L.fmt(v, 2) : ''; }
  function cargarFormulario(a) {
    ponRadio('pauta', a.pauta);
    ponRadio('unidadHidratos', a.unidadHidratos);
    $('mismoRatio').checked = a.mismoRatio === true;
    var r = a.ratio || {}, d = a.dosisFija || {};
    ponNum('ratio-todas', r.todas);
    L.COMIDAS.forEach(function (c) { ponNum('ratio-' + c, r[c]); ponNum('fija-' + c, d[c]); });
    ponNum('sensibilidad', a.sensibilidad);
    ponNum('objetivo', a.objetivo);
    ponRadio('paso', a.paso);
    ponRadio('redondeo', a.redondeo || 'cercano');
    ponNum('horasActiva', a.horasActiva);
    ponNum('hipo', a.hipo);
    ponNum('alta', a.alta);
    ponNum('dosisMax', a.dosisMax);
    filas = (Array.isArray(a.tabla) ? a.tabla : []).map(function (f) {
      return { desde: L.fmt(f.desde, 0), hasta: L.fmt(f.hasta, 0), u: L.fmt(Math.abs(f.u), 2), signo: f.u < 0 ? -1 : 1 };
    });
    pintarFilas();
    actualizarFormulario();
    limpiarMarcas();
    $('ajErrores').hidden = true;
  }
  function actualizarFormulario() {
    var p = valorRadio('pauta');
    $('ajRatio').hidden = p !== 'ratio';
    $('ajFija').hidden = p !== 'fija';
    var gr = valorRadio('unidadHidratos') === 'gramos';
    var mismo = $('mismoRatio').checked;
    $('ratioTodasFila').hidden = !mismo;
    $('ratioComidas').hidden = mismo;
    $('ratioTodasTexto').textContent = gr ? 'Gramos que cubre 1 unidad' : 'Unidades por ración';
    var uds = document.querySelectorAll('.ud-ratio');
    for (var i = 0; i < uds.length; i++) uds[i].textContent = gr ? 'gramos que cubre 1 unidad' : 'unidades por ración';
    $('ayudaRatio').textContent = gr
      ? 'Si le dijeron «1 unidad por cada 12 g», escribe 12.'
      : 'Si le dijeron «1,5 unidades por ración», escribe 1,5.' + (mismo ? '' : ' Si para la merienda no le dieron ratio, pregúntalo.');
  }
  $('vistaAjustes').addEventListener('change', actualizarFormulario);
  $('vistaAjustes').addEventListener('input', function (ev) {
    if (ev.target.classList) ev.target.classList.remove('invalida');
    var fila = ev.target.closest ? ev.target.closest('.fila-tabla') : null;
    if (fila) fila.classList.remove('invalida');
  });

  function pintarFilas() {
    var cont = $('tablaFilas');
    cont.textContent = '';
    if (!filas.length) {
      var p = document.createElement('p');
      p.className = 'ayuda';
      p.textContent = 'Sin filas: la glucosa no suma ni resta nada.';
      cont.appendChild(p);
    }
    filas.forEach(function (f, i) {
      var d = document.createElement('div');
      d.className = 'fila-tabla';
      d.setAttribute('data-i', String(i));
      d.innerHTML =
        '<div class="ft-linea">De <input class="entrada corta" data-k="desde" type="text" inputmode="numeric" autocomplete="off" aria-label="Fila ' + (i + 1) + ': desde (mg/dL)"> a <input class="entrada corta" data-k="hasta" type="text" inputmode="numeric" autocomplete="off" aria-label="Fila ' + (i + 1) + ': hasta (mg/dL)"> mg/dL</div>' +
        '<div class="ft-linea"><button type="button" class="signo" data-k="signo"></button><input class="entrada corta" data-k="u" type="text" inputmode="decimal" autocomplete="off" aria-label="Fila ' + (i + 1) + ': unidades"> unidades' +
        '<button type="button" class="icono-btn quitar" data-k="quitar" aria-label="Quitar la fila ' + (i + 1) + '">' + ICONO_PAPELERA + '</button></div>';
      d.querySelector('[data-k="desde"]').value = f.desde;
      d.querySelector('[data-k="hasta"]').value = f.hasta;
      d.querySelector('[data-k="u"]').value = f.u;
      pintarSigno(d.querySelector('[data-k="signo"]'), f.signo);
      cont.appendChild(d);
    });
  }
  function pintarSigno(b, signo) {
    b.textContent = signo < 0 ? '−' : '+';
    b.classList.toggle('resta', signo < 0);
    b.setAttribute('aria-label', signo < 0 ? 'Restar unidades. Pulsa para sumar.' : 'Sumar unidades. Pulsa para restar.');
  }
  $('tablaFilas').addEventListener('input', function (ev) {
    var fila = ev.target.closest('.fila-tabla');
    if (!fila) return;
    var i = Number(fila.getAttribute('data-i')), k = ev.target.getAttribute('data-k');
    if (k === 'desde' || k === 'hasta' || k === 'u') filas[i][k] = ev.target.value;
  });
  $('tablaFilas').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    var fila = b.closest('.fila-tabla');
    var i = Number(fila.getAttribute('data-i')), k = b.getAttribute('data-k');
    if (k === 'signo') { filas[i].signo = -filas[i].signo; pintarSigno(b, filas[i].signo); }
    if (k === 'quitar') { filas.splice(i, 1); pintarFilas(); }
  });
  $('anadirFila').addEventListener('click', function () {
    var ult = filas[filas.length - 1];
    var desde = '';
    if (ult) { var h = L.leerNumero(ult.hasta); if (h !== null) desde = L.fmt(h + 1, 0); }
    filas.push({ desde: desde, hasta: '', u: '', signo: 1 });
    pintarFilas();
    var todas = $('tablaFilas').querySelectorAll('.fila-tabla');
    var nueva = todas[todas.length - 1];
    if (nueva) nueva.querySelector(desde ? '[data-k="hasta"]' : '[data-k="desde"]').focus();
  });

  function leerFormulario() {
    function num(txt) {
      var t = String(txt === null || txt === undefined ? '' : txt).trim();
      if (t === '') return null;
      var v = L.leerNumero(t);
      return v === null ? NaN : v;
    }
    function n(id) { return num($(id).value); }
    var pasoV = valorRadio('paso');
    var o = {
      version: 1,
      pauta: valorRadio('pauta'),
      unidadHidratos: valorRadio('unidadHidratos'),
      mismoRatio: $('mismoRatio').checked,
      ratio: { todas: n('ratio-todas') },
      sensibilidad: n('sensibilidad'),
      objetivo: n('objetivo'),
      dosisFija: {},
      tabla: filas.map(function (f) {
        var u = num(f.u);
        if (typeof u === 'number' && isFinite(u)) u = (u < 0 || f.signo < 0) ? -Math.abs(u) : Math.abs(u);
        return { desde: num(f.desde), hasta: num(f.hasta), u: u };
      }),
      paso: pasoV === '0.5' ? 0.5 : (pasoV === '1' ? 1 : null),
      redondeo: valorRadio('redondeo'),
      horasActiva: n('horasActiva'),
      hipo: n('hipo'),
      alta: n('alta'),
      dosisMax: n('dosisMax')
    };
    L.COMIDAS.forEach(function (c) { o.ratio[c] = n('ratio-' + c); o.dosisFija[c] = n('fija-' + c); });
    return o;
  }
  var CAMPO_A_CAJA = { pauta: 'fsPauta', unidadHidratos: 'fsHidratos', paso: 'fsBoli', redondeo: 'fsBoli' };
  function marcarCampo(c) {
    var m = /^tabla-(\d+)$/.exec(c);
    if (m) {
      var fila = $('tablaFilas').querySelector('[data-i="' + m[1] + '"]');
      if (fila) fila.classList.add('invalida');
      return;
    }
    var el = $(CAMPO_A_CAJA[c] || c);
    if (el) el.classList.add('invalida');
  }
  function limpiarMarcas() {
    var xs = document.querySelectorAll('#vistaAjustes .invalida');
    for (var i = 0; i < xs.length; i++) xs[i].classList.remove('invalida');
  }
  function mostrarErrores(textos, titulo) {
    var box = $('ajErrores');
    box.textContent = '';
    var b = document.createElement('b');
    b.textContent = titulo || 'No se ha podido guardar:';
    box.appendChild(b);
    var ul = document.createElement('ul');
    textos.forEach(function (t) { var li = document.createElement('li'); li.textContent = t; ul.appendChild(li); });
    box.appendChild(ul);
    box.hidden = false;
    try { box.scrollIntoView({ block: 'center' }); } catch (e) {}
  }
  function avisarProblemas(problemas) {
    mostrarErrores(problemas.map(function (p) { marcarCampo(p.campo); return p.texto; }), 'Falta algo por revisar:');
  }

  $('ajGuardar').addEventListener('click', function () {
    var o = leerFormulario();
    limpiarMarcas();
    var problemas = L.validarAjustes(o);
    if (problemas.length) { avisarProblemas(problemas); return; }
    var limpia = L.limpiarPauta(o);
    problemas = L.validarAjustes(limpia);
    if (problemas.length) { avisarProblemas(problemas); return; }
    $('ajErrores').hidden = true;
    confirmar('¿Guardar estos datos?', L.resumen(limpia).concat(['Se guardan en este móvil.']), 'Sí, guardar', function () {
      var ok = guardarPauta(limpia);
      cerrar();
      if (!ok) { aviso('Guardados hasta cerrar: este navegador no deja guardar.'); return; }
      confirmar('Datos guardados', ['¿Quieres mandar estos números a otro móvil? Por ejemplo, por WhatsApp.'], 'Enviar a otro móvil', enviarPauta, { textoNo: 'No, gracias' });
    });
  });

  $('btnAjustes').addEventListener('click', function () {
    if (!aj) { abrirAjustes(); return; }
    confirmar('Datos de la pauta', ['Son los números que dio el endocrino.', 'Cámbialos solo si él o tu educadora te lo indican.'], 'Ver o cambiar', abrirAjustes);
  });
  $('btnConfigurar').addEventListener('click', abrirAjustes);

  /* ---------- Pasar la pauta a otro móvil con un enlace ---------- */
  function enlaceDe(p) { return location.origin + location.pathname + '#pauta=' + L.codificarPauta(p); }
  function enviarPauta() {
    if (!valida(pauta)) return;
    var url = enlaceDe(pauta);
    if (navigator.share) {
      var promesa;
      try { promesa = navigator.share({ title: 'Mi insulina', text: 'Abre este enlace para poner los datos de la pauta en Mi insulina:', url: url }); }
      catch (e) { mostrarEnlace(url, false); return; }
      Promise.resolve(promesa).catch(function (e) {
        if (e && e.name === 'AbortError') return;
        mostrarEnlace(url, false);
      });
      return;
    }
    mostrarEnlace(url, false);
  }
  function mostrarEnlace(url, fallo) {
    if (fallo) {
      confirmar('Enlace con los datos', ['No se ha podido copiar solo. Mantén el dedo sobre el enlace, elige «Seleccionar todo» y luego «Copiar».'], 'Cerrar', null, { enlace: url, textoNo: null });
      return;
    }
    confirmar('Enlace con los datos', ['Cópialo y mándalo por WhatsApp. Al abrirlo en el otro móvil, los datos se guardan allí.'], 'Copiar enlace', function () { copiar(url); }, { enlace: url, textoNo: 'Cerrar' });
  }
  function copiar(url) {
    function bien() { aviso('Enlace copiado. Pégalo en WhatsApp.'); }
    function mal() { if (copiarViejo(url)) bien(); else mostrarEnlace(url, true); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(url).then(bien, mal); return; }
    } catch (e) {}
    mal();
  }
  function copiarViejo(texto) {
    var ta = document.createElement('textarea');
    ta.value = texto;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-1000px';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  $('btnEnviar').addEventListener('click', enviarPauta);

  // Al abrir un enlace con datos (#pauta=...), pregunta si se guardan en este móvil.
  function revisarEnlace() {
    var h = location.hash || '';
    if (h.indexOf('#pauta=') !== 0) return;
    var p = L.decodificarPauta(h.slice(7));
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
    if (!p) {
      confirmar('Este enlace no sirve', ['Está incompleto o dañado. Pide que te lo vuelvan a mandar.'], 'Entendido', null, { textoNo: null });
      return;
    }
    var habia = valida(pauta);
    if (habia && JSON.stringify(L.limpiarPauta(pauta)) === JSON.stringify(p)) { aviso('Este móvil ya tiene estos datos'); return; }
    confirmar('Datos de la pauta recibidos', L.resumen(p).concat([habia ? 'Sustituyen a los datos que había en este móvil.' : 'Se guardarán en este móvil.']), 'Guardar en este móvil', function () {
      var ok = guardarPauta(p);
      irInicio();
      aviso(ok ? 'Datos guardados' : 'Guardados hasta cerrar: este navegador no deja guardar.');
    });
  }
  window.addEventListener('hashchange', revisarEnlace);

  /* ---------- Confirmaciones y avisos flotantes ---------- */
  var accionModal = null, focoPrevio = null;
  function confirmar(titulo, lineas, textoSi, cb, op) {
    op = op || {};
    $('modalTitulo').textContent = titulo;
    var t = $('modalTexto');
    t.textContent = '';
    lineas.forEach(function (x) { var p = document.createElement('p'); p.textContent = x; t.appendChild(p); });
    var enl = $('modalEnlace');
    enl.hidden = !op.enlace;
    enl.value = op.enlace || '';
    $('modalSi').textContent = textoSi;
    $('modalNo').hidden = op.textoNo === null;
    $('modalNo').textContent = op.textoNo || 'Cancelar';
    accionModal = cb;
    focoPrevio = document.activeElement;
    $('modal').hidden = false;
    try { $('modalSi').focus(); } catch (e) {}
  }
  function cerrarModal(devolverFoco) {
    if ($('modal').hidden) return;
    $('modal').hidden = true;
    accionModal = null;
    if (devolverFoco) { try { if (focoPrevio && focoPrevio.focus) focoPrevio.focus(); } catch (e) {} }
  }
  $('modalSi').addEventListener('click', function () { var cb = accionModal; cerrarModal(false); if (cb) cb(); });
  $('modalNo').addEventListener('click', function () { cerrarModal(true); });
  $('modal').addEventListener('click', function (ev) { if (ev.target === $('modal')) cerrarModal(true); });
  $('modalEnlace').addEventListener('focus', function () { try { this.select(); } catch (e) {} });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') cerrarModal(true); });

  var tAviso = null;
  function aviso(txt) {
    var t = $('toast');
    t.textContent = txt;
    t.classList.add('visible');
    clearTimeout(tAviso);
    tAviso = setTimeout(function () { t.classList.remove('visible'); }, 2800);
  }

  // Al volver a la app después de un rato, se actualizan la comida y la última dosis.
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState !== 'visible' || !aj || $('vistaCalcular').hidden) return;
    if ($('glucosa').value.trim() === '' && $('hidratos').value.trim() === '') {
      estado.comida = null;
      estado.reciente = null;
      prepararCalculo();
    }
  });

  /* ---------- Funcionar sin internet ---------- */
  function registrarSW() {
    if (!('serviceWorker' in navigator)) return;
    var local = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    if (location.protocol !== 'https:' && !local) return;
    try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) {}
  }

  window.MiInsulina = { Logica: L, version: VERSION };
  irInicio();
  revisarEnlace();
  registrarSW();
})();
</script>
</body>
